[package]
name = "bvh-stats"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Standalone workspace: the `stats` feature must not leak into other builds of rnpt-bvh.
[workspace]

[dependencies]
hb-common = { path = "../history-bench/common" }
rnpt-bvh = { path = "../../crates/rnpt-bvh" }

[features]
# Count operations. Without it (--no-default-features), the tool only times, pinned to one core.
default = ["count"]
count = ["rnpt-bvh/stats"]

# Same as rnpt's, so timings match history-bench.
[profile.release]
debug = true
lto = "thin"
codegen-units = 1
panic = "abort"
