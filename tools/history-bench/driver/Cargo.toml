[package]
name = "history-bench"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
hb-common = { path = "../common" }
# Only used to generate secondary rays from primary hits; correctness is checked
# against a brute-force reference, never against this crate.
rnpt-bvh = { path = "../../../crates/rnpt-bvh" }
gltf = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
